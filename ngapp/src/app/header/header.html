<aside class="sidebar">
  <div class="sidebar-top">
    <a class="brand" routerLink="/" (click)="close()">Baz<span>ar</span></a>
    <button class="menu-toggle d-lg-none" type="button" [attr.aria-expanded]="open()" (click)="toggle()">
      {{ open() ? 'Close' : 'Menu' }}
    </button>
  </div>

  <nav class="sidebar-nav" [class.open]="open()">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="close()">Home</a>
    <a routerLink="/products" routerLinkActive="active" (click)="close()">Products</a>
    <a routerLink="/contact" routerLinkActive="active" (click)="close()">Contact</a>
    <a routerLink="/cart" routerLinkActive="active" (click)="close()">Cart @if (cart.count() > 0) { <span class="cart-badge">{{ cart.count() }}</span> }</a>
    @if (auth.isAdmin()) {
      <a routerLink="/admin" routerLinkActive="active" (click)="close()">Admin</a>
    }

    @if (auth.user(); as u) {
      <span class="who">{{ u.email }} ({{ u.role }})</span>
      <button class="signin" type="button" (click)="logout()">Sign out</button>
    } @else {
      <a class="signin" routerLink="/login" routerLinkActive="active" (click)="close()">Sign in</a>
    }
  </nav>
</aside>
