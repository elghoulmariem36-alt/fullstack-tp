<div class="container py-4">
  <a routerLink="/products" class="btn btn-outline-secondary mb-3">← Back to catalogue</a>

  @if (loading()) {
    <div>Loading...</div>
  } @else if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  } @else if (product(); as p) {
    <div class="row">
      <div class="col-md-5">
        <img [src]="p.thumbnail" [alt]="p.title" class="img-fluid" />
      </div>
      <div class="col-md-7">
        <h2>{{ p.title }}</h2>
        <p class="text-muted">{{ p.category }}</p>
        <p>{{ p.description }}</p>
        <p class="fs-4 fw-bold">{{ p.price }} $</p>
      </div>
    </div>
  }
</div><p>product-detail works!</p>
