<div class="container py-4">
  <div class="row g-2 mb-4">
    <div class="col-md-6">
      <input
        #search
        type="search"
        class="form-control"
        placeholder="Search a product..."
        (keyup.enter)="onSearch(search.value)"
      />
    </div>
    <div class="col-md-3">
      <button class="btn btn-primary w-100" (click)="onSearch(search.value)">Search</button>
    </div>
    <div class="col-md-3">
      <select class="form-select" (change)="onCategory($any($event.target).value)">
        <option value="">All categories</option>
        @for (c of categories(); track c.id) {
          <option [value]="c.name">{{ c.name }} ({{ c._count.products }})</option>
        }
      </select>
    </div>
  </div>

  @if (loading()) {
    <div class="text-center">Loading...</div>
  } @else if (error()) {
    <div class="alert alert-danger">{{ error() }}</div>
  } @else if (products().length === 0) {
    <div class="alert alert-info">No products found</div>
  } @else {
    <div class="row g-3">
      @for (p of products(); track p.id) {
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
          <app-product-card [product]="p" />
        </div>
      }
    </div>

    <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
      <button class="btn btn-outline-primary" (click)="previous()" [disabled]="skip() === 0">
        Previous
      </button>
      <span>Page {{ skip() / limit + 1 }}</span>
      <button
        class="btn btn-outline-primary"
        (click)="next()"
        [disabled]="skip() + limit >= total()"
      >
        Next
      </button>
    </div>
  }
</div>
