<a class="btn btn-warning mb-3" routerLink="/appareils">Back</a>

@if (loading()) {
  <p>Loading...</p>
} @else if (error()) {
  <div class="alert alert-warning">{{ error() }}</div>
} @else if (appareil(); as a) {
  <h2>{{ a.name }}</h2>
  <p>
    Status:
    <span [class.text-success]="a.status === 'On'" [class.text-danger]="a.status === 'Off'">
      {{ a.status }}
    </span>
  </p>
  <p class="text-muted">
    Created: {{ a.createdAt | date: 'medium' }}<br />
    Updated: {{ a.updatedAt | date: 'medium' }}
  </p>
}
