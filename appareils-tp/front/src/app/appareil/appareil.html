<li class="card mb-2">
  <div class="card-body d-flex align-items-center gap-3">
    <div class="flex-grow-1">
      <h5
        class="card-title"
        [class.text-success]="appareilStatus() === 'On'"
        [class.text-danger]="appareilStatus() === 'Off'"
      >
        {{ appareilName() }} - {{ appareilStatus() }}
      </h5>
      <input type="text" class="form-control" [(ngModel)]="appareilName" />
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-sm btn-outline-primary" [routerLink]="['/appareils', index()]">Detail</a>
      @if (appareilStatus() === 'Off') {
        <button class="btn btn-sm btn-success" (click)="switchOn.emit()">Switch on</button>
      } @else {
        <button class="btn btn-sm btn-secondary" (click)="switchOff.emit()">Switch off</button>
      }
    </div>
  </div>
</li>
