<li class="card mb-2">
  <div class="card-body d-flex align-items-center gap-3">
    <div class="flex-grow-1">
      @if (editing()) {
        <div class="input-group">
          <input class="form-control" [(ngModel)]="draft" />
          <button class="btn btn-primary" (click)="save()">Save</button>
          <button class="btn btn-outline-secondary" (click)="editing.set(false)">Cancel</button>
        </div>
      } @else {
        <h5
          class="card-title mb-0"
          [class.text-success]="appareil().status === 'On'"
          [class.text-danger]="appareil().status === 'Off'"
        >
          {{ appareil().name }} - {{ appareil().status }}
        </h5>
      }
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-sm btn-outline-primary" [routerLink]="['/appareils', appareil()._id]">Detail</a>
      <button class="btn btn-sm btn-outline-secondary" (click)="startEdit()">Edit</button>
      @if (appareil().status === 'Off') {
        <button class="btn btn-sm btn-success" (click)="switchOn.emit()">Switch on</button>
      } @else {
        <button class="btn btn-sm btn-secondary" (click)="switchOff.emit()">Switch off</button>
      }
      <button class="btn btn-sm btn-outline-danger" (click)="remove.emit()">Delete</button>
    </div>
  </div>
</li>
