<article class="appareil" [class.on]="appareil().status === 'On'">
  <div class="d-flex justify-content-between align-items-start gap-2">
    <div class="info">
      @if (editing()) {
        <div class="input-group input-group-sm mb-1">
          <input class="form-control" [(ngModel)]="draft" (keyup.enter)="save()" />
          <button class="btn btn-primary" (click)="save()">Save</button>
          <button class="btn btn-outline-secondary" (click)="editing.set(false)">Cancel</button>
        </div>
      } @else {
        <h2 class="h6 fw-bold mb-1 text-truncate">{{ appareil().name }}</h2>
      }
      @if (appareil().room; as r) {
        <span class="room">{{ r.name }}</span>
      } @else {
        <span class="room muted">No room</span>
      }
    </div>

    <div class="form-check form-switch">
      <input
        class="form-check-input"
        type="checkbox"
        role="switch"
        [checked]="appareil().status === 'On'"
        [attr.aria-label]="'Toggle ' + appareil().name"
        (change)="toggled.emit()"
      />
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-3">
    <span class="state">{{ appareil().status }}</span>
    <div class="btn-group btn-group-sm">
      <a class="btn btn-outline-secondary" [routerLink]="['/appareils', appareil()._id]">Detail</a>
      <button class="btn btn-outline-secondary" (click)="startEdit()">Rename</button>
      <button class="btn btn-outline-danger" (click)="removed.emit()">Delete</button>
    </div>
  </div>
</article>
